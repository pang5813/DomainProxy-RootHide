name: Build RootHide deb
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test global rules
        run: python3 tests/config_test.py
      - name: Install packaging tools
        run: brew install make ldid dpkg
      - name: Install RootHide Theos
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Compile UI and controller first
        run: gmake all FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache: false
      - name: Build and validate standalone tunnel core
        run: |
          git clone https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box"
          cd "$RUNNER_TEMP/sing-box"
          git checkout 2dcb86941f5db01bbe296acae555a3b1f38c0441
          python3 "$GITHUB_WORKSPACE/patches/install_dynamic.py" "$RUNNER_TEMP/sing-box"
          go test -race ./protocol/domainproxy
          go mod download github.com/sagernet/sing-tun
          TUN_SOURCE="$(go list -m -f '{{.Dir}}' github.com/sagernet/sing-tun)"
          cp -R "$TUN_SOURCE" "$RUNNER_TEMP/sing-tun-ios"
          python3 "$GITHUB_WORKSPACE/patches/fix_ios_gateway.py" "$RUNNER_TEMP/sing-tun-ios"
          chmod u+w "$RUNNER_TEMP/sing-tun-ios"
          cp "$GITHUB_WORKSPACE/patches/ios_routes_test.go" "$RUNNER_TEMP/sing-tun-ios/domainproxy_routes_test.go"
          python3 "$GITHUB_WORKSPACE/tests/ios_patch_test.py" "$RUNNER_TEMP/sing-tun-ios"
          go mod edit -replace "github.com/sagernet/sing-tun=$RUNNER_TEMP/sing-tun-ios"
          go test github.com/sagernet/sing-tun -run TestDomainProxySplitRoutes -count=1
          go build -tags with_gvisor -o "$RUNNER_TEMP/sing-box-check" ./cmd/sing-box
          "$RUNNER_TEMP/sing-box-check" check -c "$GITHUB_WORKSPACE/layout/Library/DomainProxy/global-config.json"
          python3 "$GITHUB_WORKSPACE/tests/core_api_test.py" "$RUNNER_TEMP/sing-box-check"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CGO_ENABLED=1 GOOS=ios GOARCH=arm64
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CGO_CFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=16.0"
          export CGO_LDFLAGS="$CGO_CFLAGS"
          mkdir -p "$GITHUB_WORKSPACE/layout/usr/libexec" "$GITHUB_WORKSPACE/layout/usr/share/doc/local.domainproxy"
          go build -tags with_gvisor -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/layout/usr/libexec/domainproxy-core" ./cmd/sing-box
          ldid -S"$GITHUB_WORKSPACE/settingsapp/entitlements.plist" "$GITHUB_WORKSPACE/layout/usr/libexec/domainproxy-core"
          cp "$GITHUB_WORKSPACE/patches/dynamic/"*.go "$GITHUB_WORKSPACE/layout/usr/share/doc/local.domainproxy/"
          cp "$GITHUB_WORKSPACE/patches/install_dynamic.py" "$GITHUB_WORKSPACE/layout/usr/share/doc/local.domainproxy/"
          cp LICENSE "$GITHUB_WORKSPACE/layout/usr/share/doc/local.domainproxy/COPYING.sing-box"
          cp "$GITHUB_WORKSPACE/patches/fix_ios_gateway.py" "$GITHUB_WORKSPACE/layout/usr/share/doc/local.domainproxy/ios-gateway-patch.py"
      - name: Build
        run: gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
      - name: Preserve root controller ownership and setuid permission
        run: |
          for package in packages/*.deb; do
            stage="$RUNNER_TEMP/domainproxy-final"
            dpkg-deb --raw-extract "$package" "$stage"
            chmod 4755 "$stage/usr/bin/domainproxyctl"
            COPYFILE_DISABLE=1 dpkg-deb --build --root-owner-group -Zgzip "$stage" "$package"
          done
      - name: Verify package
        run: |
          python3 tests/verify_deb.py packages/*.deb
          for package in packages/*.deb; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
            shasum -a 256 "$package" > "$package.sha256"
          done
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: DomainProxy-roothide
          path: |
            packages/*.deb
            packages/*.deb.sha256
          if-no-files-found: error
