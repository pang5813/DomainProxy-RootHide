name: Build RootHide deb
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test domain rules
        run: node tests/pac.test.cjs
      - name: Install packaging tools
        run: brew install make ldid dpkg
      - name: Install RootHide Theos
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build
        run: gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
      - name: Verify package
        run: |
          for package in packages/*.deb; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
            shasum -a 256 "$package" > "$package.sha256"
          done
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: DomainProxy-roothide
          path: |
            packages/*.deb
            packages/*.deb.sha256
          if-no-files-found: error
